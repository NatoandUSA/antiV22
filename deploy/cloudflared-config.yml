# Cloudflare named tunnel — Etsy Product Manager web dashboard
# Team URL:  https://etsy.theglobalserviceteam.site   ->   http://localhost:8000
#
# Production runs on the VPS (full walkthrough in ../DEPLOY_VPS.md).
# One-time setup on the server:
#   cloudflared tunnel login
#   cloudflared tunnel create etsy-vps
#   cloudflared tunnel route dns --overwrite-dns etsy-vps etsy.theglobalserviceteam.site
#
# cloudflared auto-finds the credentials `tunnel create` wrote to
# ~/.cloudflared/<TUNNEL-ID>.json, so no path is hardcoded here.

tunnel: etsy-vps

ingress:
  # Everything for this hostname goes to the local web dashboard.
  - hostname: etsy.theglobalserviceteam.site
    service: http://localhost:8000
  # Required catch-all — anything else gets a 404.
  - service: http_status:404
