# Cloudflare named tunnel — Etsy Product Manager web dashboard
# Team URL:  https://etsy.theglobalserviceteam.site   ->   http://localhost:8000
#
# One-time setup (full walkthrough in ../TUNNEL_SETUP.md):
#   cloudflared login
#   cloudflared tunnel create etsy-agent
#   cloudflared tunnel route dns etsy-agent etsy.theglobalserviceteam.site
#
# cloudflared auto-finds the credentials that `tunnel create` wrote:
#   macOS/Linux : ~/.cloudflared/<TUNNEL-ID>.json
#   Windows     : C:\Users\<you>\.cloudflared\<TUNNEL-ID>.json
# so no path is hardcoded here (works on both your Mac and Windows).
# If you ever see "tunnel credentials file not found", uncomment and set:
#   credentials-file: C:/Users/Admin/.cloudflared/<TUNNEL-ID>.json

tunnel: etsy-agent

ingress:
  # Everything for this hostname goes to the local web dashboard.
  - hostname: etsy.theglobalserviceteam.site
    service: http://localhost:8000
  # Required catch-all — anything else gets a 404.
  - service: http_status:404
